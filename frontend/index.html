<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f5f5f5;
            text-align: center;
            display: none;
        }

        .sentiment {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
        }

        .confidence {
            color: #666;
            font-size: 16px;
        }

        .error {
            color: #d32f2f;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Sentiment Analyzer</h1>

        <p class="subtitle">
            BERT-based NLP Sentiment Analysis
        </p>

        <textarea
            id="textInput"
            placeholder="Enter your text here..."
        ></textarea>

        <button onclick="analyzeSentiment()">
            Analyze Sentiment
        </button>

        <div id="result">
            <div>Prediction</div>

            <div id="sentiment" class="sentiment"></div>

            <div id="confidence" class="confidence"></div>
        </div>

    </div>

    <script>
        async function analyzeSentiment() {

            const text = document.getElementById("textInput").value.trim();
            const resultBox = document.getElementById("result");
            const sentiment = document.getElementById("sentiment");
            const confidence = document.getElementById("confidence");

            if (!text) {
                resultBox.style.display = "block";
                sentiment.innerHTML = "Please enter some text.";
                sentiment.className = "sentiment error";
                confidence.innerHTML = "";
                return;
            }

            sentiment.innerHTML = "Analyzing...";
            sentiment.className = "sentiment";
            confidence.innerHTML = "";
            resultBox.style.display = "block";

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            text: text
                        })
                    }
                );

                const data = await response.json();

                sentiment.innerHTML =
                    data.sentiment.toUpperCase();

                confidence.innerHTML =
                    "Confidence: " +
                    (data.confidence * 100).toFixed(2) +
                    "%";

            } catch (error) {

                sentiment.innerHTML =
                    "Unable to connect to API";

                sentiment.className =
                    "sentiment error";

                confidence.innerHTML =
                    "Make sure FastAPI is running.";
            }
        }
    </script>

</body>
</html>
