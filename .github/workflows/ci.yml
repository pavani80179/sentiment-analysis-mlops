name: Sentiment Analysis CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile src/preprocess.py
          python -m py_compile src/train.py
          python -m py_compile src/register_model.py
          python -m py_compile src/prepare_retraining.py
          python -m py_compile app/main.py

      - name: CI completed
        run: echo "Sentiment Analysis CI passed successfully!"